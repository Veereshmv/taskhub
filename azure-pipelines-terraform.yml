trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

pool:
  vmImage: ubuntu-latest

variables:
- name: azureServiceConnection
  value: taskhub-azure-sc

- name: terraformWorkingDirectory
  value: terraform


stages:

# =========================
# VALIDATE AND PLAN
# =========================
- stage: ValidateAndPlan
  displayName: Terraform Validate and Plan

  jobs:
  - job: TerraformPlan
    displayName: Terraform Plan

    steps:

    # Retrieve SQL password from Azure Key Vault
    - task: AzureKeyVault@2
      displayName: Retrieve SQL Password from Key Vault
      inputs:
        azureSubscription: $(azureServiceConnection)
        KeyVaultName: kv-taskhub-dev260826
        SecretsFilter: SQL-PASSWORD
        RunAsPreJob: false

    # Install Terraform
    - task: Bash@3
      displayName: Install Terraform
      inputs:
        targetType: inline
        script: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common curl

          wget -O- https://apt.releases.hashicorp.com/gpg | \
          gpg --dearmor | \
          sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
          sudo tee /etc/apt/sources.list.d/hashicorp.list

          sudo apt-get update
          sudo apt-get install -y terraform

          terraform version

    # Terraform Init / Validate / Plan
    - task: AzureCLI@2
      displayName: Terraform Init Validate Plan
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(terraformWorkingDirectory)
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          export ARM_USE_OIDC=true
          export ARM_OIDC_TOKEN=$idToken

          terraform init
          terraform fmt -check
          terraform validate
          terraform plan -out=tfplan
      env:
        TF_VAR_sql_admin_password: $(SQL-PASSWORD)

    # Publish Terraform Plan
    - publish: $(terraformWorkingDirectory)/tfplan
      artifact: terraform-plan
      displayName: Publish Terraform Plan


# =========================
# APPLY
# =========================
- stage: Apply
  displayName: Terraform Apply

  dependsOn: ValidateAndPlan
  condition: succeeded()

  jobs:
  - job: TerraformApply
    displayName: Terraform Apply

    steps:

    # Retrieve SQL password from Azure Key Vault
    - task: AzureKeyVault@2
      displayName: Retrieve SQL Password from Key Vault
      inputs:
        azureSubscription: $(azureServiceConnection)
        KeyVaultName: kv-taskhub-dev260826
        SecretsFilter: SQL-PASSWORD
        RunAsPreJob: false

    # Install Terraform
    - task: Bash@3
      displayName: Install Terraform
      inputs:
        targetType: inline
        script: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common curl

          wget -O- https://apt.releases.hashicorp.com/gpg | \
          gpg --dearmor | \
          sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
          sudo tee /etc/apt/sources.list.d/hashicorp.list

          sudo apt-get update
          sudo apt-get install -y terraform

          terraform version

    # Download the exact plan generated in the Plan stage
    - download: current
      artifact: terraform-plan

    # Apply Terraform Plan
    - task: AzureCLI@2
      displayName: Terraform Apply
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(terraformWorkingDirectory)
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          export ARM_USE_OIDC=true
          export ARM_OIDC_TOKEN=$idToken

          terraform init
          terraform apply -auto-approve $(Pipeline.Workspace)/terraform-plan/tfplan
      env:
        TF_VAR_sql_admin_password: $(SQL-PASSWORD)